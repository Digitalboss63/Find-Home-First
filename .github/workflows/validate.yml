name: Validate application

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: find-home-first
    env:
      DEMO_MODE: "true"
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_ci_placeholder
      PLATFORM_OWNER_CLERK_USER_ID: user_ci_owner

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: find-home-first/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: ./node_modules/.bin/tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Drizzle schema check
        run: npm run db:check

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Production build
        run: npm run build
